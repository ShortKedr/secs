name: Space Battle Cover

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: space-battle-cover-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      refresh: ${{ steps.check.outputs.refresh }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check for changes affecting the cover
        id: check
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "refresh=true" >> "$GITHUB_OUTPUT"
            echo "Manual cover refresh requested." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          captured_commit=$(python3 -c 'import json; print(json.load(open("docs/space-battle/cover.png.json"))["SourceCommit"])')
          if [[ ! "$captured_commit" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]] ||
             ! git merge-base --is-ancestor "$captured_commit" HEAD; then
            echo "refresh=true" >> "$GITHUB_OUTPUT"
            echo "Cover provenance is unavailable; refreshing it." >> "$GITHUB_STEP_SUMMARY"
          elif git diff-tree --quiet -r "$captured_commit" HEAD -- \
            SpaceBattle.Web/ SpaceBattle.Core/ SpaceBattle.SKECS/ SKECS/ \
            SpaceBattle.Game/Assets/ tools/build-space-battle-web.ps1 \
            tools/web/ tools/space-battle/cover.py \
            tools/space-battle/cover-requirements.txt \
            docs/space-battle/cover-settings.json \
            .github/workflows/space-battle-cover.yml LICENSE; then
            echo "refresh=false" >> "$GITHUB_OUTPUT"
            echo "No cover-affecting changes since $captured_commit; skipping capture." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "refresh=true" >> "$GITHUB_OUTPUT"
            echo "Cover-affecting changes found since $captured_commit." >> "$GITHUB_STEP_SUMMARY"
          fi

  capture:
    needs: changes
    if: needs.changes.outputs.refresh == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/Benchmarks.Local/tmp/playwright-browsers
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: SpaceBattle.Web/global.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install capture validation dependencies
        run: |
          python -m pip install -r tools/space-battle/cover-requirements.txt
      - name: Install browser capture dependencies
        working-directory: tools/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Test capture validation
        run: |
          python -m unittest discover -s tools/space-battle -p test_cover.py
          node --test tools/web/test-cover-capture.mjs
      - name: Install the production AOT toolchain
        working-directory: SpaceBattle.Web
        run: dotnet workload install wasm-tools
      - name: Build the real production web frontend
        shell: pwsh
        run: ./tools/build-space-battle-web.ps1 -OutputDirectory Benchmarks.Local/tmp/cover-web -BasePath /
      - name: Simulate to the fixed battle tick and capture Chromium Canvas
        run: |
          python tools/space-battle/cover.py capture \
            --site Benchmarks.Local/tmp/cover-web/wwwroot \
            --source-commit "$GITHUB_SHA"
          python tools/space-battle/cover.py validate \
            --directory Benchmarks.Local/tmp/space-battle-cover --source-commit "$GITHUB_SHA"
      - name: Retain browser capture and provenance even if publication fails
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: space-battle-cover
          path: Benchmarks.Local/tmp/space-battle-cover/
          if-no-files-found: warn
          retention-days: 14

  update:
    needs: capture
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r tools/space-battle/cover-requirements.txt
      - uses: actions/download-artifact@v8
        with:
          name: space-battle-cover
          path: Benchmarks.Local/tmp/space-battle-cover
      - name: Validate the downloaded image against this source commit
        run: |
          python tools/space-battle/cover.py validate \
            --directory Benchmarks.Local/tmp/space-battle-cover --source-commit "$GITHUB_SHA"
      - name: Update only the documentation cover if main is still current
        run: |
          git fetch --no-tags origin main
          if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then
            echo "main advanced; leaving the newer source and cover untouched." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cp Benchmarks.Local/tmp/space-battle-cover/cover.png docs/space-battle/cover.png
          cp Benchmarks.Local/tmp/space-battle-cover/cover.png.json docs/space-battle/cover.png.json
          git add -- docs/space-battle/cover.png docs/space-battle/cover.png.json
          if git diff --cached --quiet; then
            echo "Cover is already current." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "docs: refresh Space Battle cover"
          # Normal fast-forward only: a concurrent main push must not be overwritten.
          if ! git push origin HEAD:refs/heads/main; then
            echo "::error::Cover publication rejected. Check contents:write policy, main branch protection, or a newer push. The validated capture remains in the workflow artifact."
            exit 1
          fi
          echo "Updated cover for source $GITHUB_SHA. GITHUB_TOKEN does not trigger push workflows." >> "$GITHUB_STEP_SUMMARY"
