name: Space Battle Pages

on:
  push:
    branches: [main]
    paths:
      - "SpaceBattle.Web/**"
      - "SpaceBattle.Core/**"
      - "SpaceBattle.SKECS/**"
      - "SKECS/**"
      - "SpaceBattle.Game/Assets/**"
      - "tools/build-space-battle-web.ps1"
      - "tools/web/**"
      - "tools/space-battle/**"
      - ".github/workflows/space-battle-pages.yml"
  pull_request:
    paths:
      - "SpaceBattle.Web/**"
      - "SpaceBattle.Core/**"
      - "SpaceBattle.SKECS/**"
      - "SKECS/**"
      - "SpaceBattle.Game/Assets/**"
      - "tools/build-space-battle-web.ps1"
      - "tools/web/**"
      - "tools/space-battle/**"
      - ".github/workflows/space-battle-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: space-battle-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: SpaceBattle.Web/global.json
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install WebAssembly AOT toolchain for the pinned SDK
        working-directory: SpaceBattle.Web
        run: dotnet workload install wasm-tools
      - name: Check supported Mono runtime and reject retired build modes
        shell: pwsh
        run: |
          python3 tools/web/test-mono-runtime.py
          ./tools/web/test-mono-runtime.ps1
      - name: Install browser and offline PNG preparation dependencies
        working-directory: tools/web
        run: npm ci
      - name: Test offline atlases, cache identity and scene capture
        run: node --test tools/web/test-web-atlases.mjs tools/web/test-web-atlas-loader.mjs tools/web/test-finalize-web-site.mjs tools/web/test-ios-diagnostics.mjs tools/space-battle/scenes/test-*.mjs
      - name: Publish shared C# simulation to WebAssembly
        shell: pwsh
        run: ./tools/build-space-battle-web.ps1 -BasePath "/${{ github.event.repository.name }}/"
      - name: Check bilingual documentation links
        run: python3 tools/check_docs.py
      - name: Check portable scalar WebAssembly instructions
        run: python3 tools/web/check-scalar-wasm.py Benchmarks.Local/tmp/web-publish/wwwroot/_framework/dotnet.native.wasm --output Benchmarks.Local/tmp/scalar-module-check.json
      - name: Install Chromium and desktop WebKit
        working-directory: tools/web
        run: npx playwright install --with-deps chromium webkit
      - name: Test Mono study measurement guards and statistics
        run: |
          node --test tools/web/test-mono-compiler-study.mjs tools/web/test-profile-mono-cpu.mjs
          python3 tools/web/test-audit-mono-build.py
          python3 tools/web/test-summarize-mono-study.py
          python3 tools/web/test-check-scalar-wasm.py
      - name: Test local publish path isolation
        shell: pwsh
        run: ./tools/web/test-build-mono-study.ps1
      - name: Validate browser simulation, controls and responsive rendering
        run: node tools/web/check-web.mjs --site Benchmarks.Local/tmp/web-publish/wwwroot --base "/${{ github.event.repository.name }}/" --require-mode aot-binary
      - name: Desktop WebKit bounded iOS regression smoke (not device verification)
        run: node tools/web/run-ios-smoke.mjs --site Benchmarks.Local/tmp/web-publish/wwwroot --browser webkit --repeats 1 --ticks 24 --faults --retry reload --raf-faults --output Benchmarks.Local/tmp/ios-webkit-smoke.json
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: space-battle-browser-checks
          path: |
            Benchmarks.Local/tmp/web-checks
            Benchmarks.Local/tmp/ios-webkit-smoke.json
            Benchmarks.Local/tmp/ios-webkit-smoke.json.raf.json
          if-no-files-found: ignore
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload Pages site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: Benchmarks.Local/tmp/web-publish/wwwroot

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Space Battle
        id: deployment
        uses: actions/deploy-pages@v4
