name: Space Battle Pages

on:
  push:
    branches: [main]
    paths:
      - "SpaceBattle.Web/**"
      - "SpaceBattle.Core/**"
      - "SpaceBattle.SECS/**"
      - "SECS/**"
      - "SpaceBattle.Game/Assets/**"
      - "tools/build-space-battle-web.ps1"
      - "tools/web/**"
      - ".github/workflows/space-battle-pages.yml"
  pull_request:
    paths:
      - "SpaceBattle.Web/**"
      - "SpaceBattle.Core/**"
      - "SpaceBattle.SECS/**"
      - "SECS/**"
      - "SpaceBattle.Game/Assets/**"
      - "tools/build-space-battle-web.ps1"
      - "tools/web/**"
      - ".github/workflows/space-battle-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: space-battle-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: SpaceBattle.Web/global.json
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Publish shared C# simulation to WebAssembly
        shell: pwsh
        run: ./tools/build-space-battle-web.ps1 -BasePath /secs/
      - name: Check bilingual documentation links
        run: python3 tools/check_docs.py
      - name: Install browser checks
        working-directory: tools/web
        run: npm ci
      - name: Install Chromium
        working-directory: tools/web
        run: npx playwright install --with-deps chromium
      - name: Validate browser simulation, controls and responsive rendering
        run: node tools/web/check-web.mjs --site Benchmarks.Local/tmp/web-publish/wwwroot --base /secs/
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: space-battle-browser-checks
          path: Benchmarks.Local/tmp/web-checks
          if-no-files-found: ignore
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload Pages site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: Benchmarks.Local/tmp/web-publish/wwwroot
          include-hidden-files: true

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Space Battle
        id: deployment
        uses: actions/deploy-pages@v4
